# DeepSeek Harness 配置文件模板（settings.yaml v2）
# 编辑此文件会影响全新安装首次启动时生成的默认 settings.yaml。

# DeepSeek Harness 配置文件（settings.yaml v2）
# 本文件由 DSH 首次启动时自动生成，可手动编辑。

# 全局默认模型，格式为 provider/model
global_default_model: deepseek-official/deepseek-v4-flash

# 压缩（compaction）使用的模型，格式为 provider/model
compaction_model: deepseek-official/deepseek-v4-flash

# 子代理默认模型，格式为 provider/model
# subagent 工具调用与插件参数 agentOptions 都未指定 provider/model 时使用；该 provider 需已配置 key，删掉此项则子代理跟随当前会话模型。
subagent:
  default_model: deepseek-official/deepseek-v4-flash

# LLM 提供方配置:type 缺省即 openai-compatible;要用 DeepSeek 专属行为(缓存 token 统计等)需显式 type: deepseek
# 适配器由插件提供:@deepseek-ai/dsh-llm-openai(openai-compatible/openai-responses)、-anthropic、-deepseek
# 未配置 key 的 provider 会被跳过并记 WARN;完全不配 provider 也能启动,首次发起请求时才报错
# models 只写 models.dev 之外的模型(自建端点、中转站、或刚发布还没进目录的 id):目录已收录的模型写了只是重复,
# 也不会列得更全——菜单/列表一律按"本文件声明 ∪ models.dev 目录"算,推理强度按目录解析。
providers:
  deepseek-official:
    type: openai-compatible
    options:
      baseUrl: https://api.deepseek.com
      # 也可以用 apiKey 直接内联;留空或未设置环境变量时该 provider 会被跳过并记 WARN
      apiKeyEnv: DEEPSEEK_API_KEY
    # models.dev 已收录该 provider(deepseek) → 模型不必列;要覆盖某个模型的显示名/系统提示,才在这里补条目。
    models: {}
  # 中转站/私有部署这类 models.dev 里没有的 provider 才需要把模型列全(目录无从补充):
  # "@deepseek-ai/dsh-relay":
  #   type: openai-compatible
  #   options:
  #     baseUrl: https://relay.example.com/v1
  #     apiKey: sk-...
  #   models:
  #     my-model:
  #       name: My Model
  #       tool_call: true

# 技能目录
skills:
  paths: []
  urls: []

# 全局规则
rules: []

# 本机统一 HTTP 出口由 network.outbound_proxy 配置；fleet.deploy.serverProxy 只用于远端下载部署包，不设置远端机器的一般网络出口。
# outbound_proxy 是本机出口代理:web_search/web_fetch、LLM 请求、models.dev 目录、MCP(HTTP)、A2A、账号、E2B 与本机下载远端 dsharp 都经它访问外网。
# url 留空(或不写本段)跟随系统代理;支持 http/https/socks4/socks4a/socks5,可带 user:pass@(日志与报错会脱敏)。
# bypass 是直连的主机(含子域),回环地址、不带点的主机名与私网 IP 总是直连;probe_url 是 GUI 设置页与 /proxy test 自检的探测地址。
# network:
#   borrowed_outbound_machine: null  # Select one machine's proxyCommand tunnel; null uses the baseline below.
#   outbound_proxy:
#     url: http://127.0.0.1:7890
#     bypass: [example.com, "*.example.org"]
#     probe_url: https://www.gstatic.com/generate_204

# 机器清单与远端自动部署偏好: GUI 的“机器”页、`dsharp machine` 与 `dsharp host web` 共用, 也会改写本段。
# 本机(local)是隐式的, 不用写; 省略的字段取默认值。密码认证的 password 以明文保存(本文件仅属主可读写)。
# fleet:
#   machines:
#     - name: build
#       kind: ssh
#       host: build.internal
#       user: dev
#       auth: key            # agent | key | password
#       keyPath: ~/.ssh/id_ed25519
#       harnessHome: ~/.dsh-build
#     - name: second
#       kind: local
#       harnessHome: /srv/second-home
#   deploy:
#     autoDeploy: false      # 默认 true: 连接前在远端安装/升级 dsharp
#     releaseVersion: latest
#     via: auto              # auto | client | server
#     serverProxy: http://127.0.0.1:7890  # 仅供远端 curl/wget 下载部署包，在远端解析；留空跟随远端自身代理或直连。

# 插件沙箱开关:默认 false;关闭时插件的装载与运行方式不变。
# 单个插件的读/写/网络权限写在 plugins."<包名>".permissions(见下方插件段说明);权限的强制执行随插件沙箱提供。
sandbox:
  enabled: false

# 外部编辑器启动器:列表第一项是 favorite, LLM 的 open_external_editor 默认启动它。
# 不配置时使用系统默认编辑器: Windows 记事本、macOS 文本编辑、Linux nano。
# 占位符: {path}/{file} 文件路径, {line} 行号, {column} 列号。
# external_editor:
#   - name: VS Code
#     command: code
#     args: ["--goto", "{path}:{line}:{column}"]
#   - name: Notepad
#     command: notepad.exe
#     args: ["{path}"]

# 插件开关:true/false 或 {enabled: true, permissions: {...}, ...插件参数}
# 插件发现即启用;只有这里显式禁用的插件才会关闭。/plugins 命令会改写本段(GUI 插件市场同样写这里)。
# permissions 是与 enabled 并列的保留键,不会作为参数交给插件:read/write/network 三项布尔值,未写的项与未写 permissions 时均为允许;
# /plugins ban_write <包名> 与 /plugins enable_write <包名> 切换 write;enable/disable 保留 permissions,remove 连同参数一并清除。
# 项目记忆 @deepseek-ai/dsh-memory 默认关闭,用 /memory on 开启;
# 参数:file(记忆文件路径)、backend(file|mongo)、capture(回合末自动捕获,默认 true)、mongo(connectionString/database/collection/key)。
# 快照恢复点 @deepseek-ai/dsh-checkpoints 默认关闭,改 true 开启;参数:max_points、keep_days。
# TOON 编码面 @deepseek-ai/dsh-toon 默认关闭(实验性:工具结果/调用改用 TOON 文本,输出侧会缓冲流式渲染);
# 参数:output(默认 true)、input(逗号分隔的工具名白名单,这些工具的结果以 TOON 进上下文)。
# IDE 本地历史 @deepseek-ai/dsh-ide-history: 只有工作区带对应标记(.vscode/*.code-workspace、.idea/*.iml、.zed)时才查该来源;
# 参数:providers(默认 [vscode, jetbrains, zed])、timeline(是否把 IDE 历史并进 /timestamp 时间线供 jump/revert/fork,默认 false,避免自动保存噪声)、
#       timeline_limit(开启后合并的条目上限,默认 50)。
# TUI @deepseek-ai/dsh-tui: 参数 highlightColor/arrowColor/dividerColor/statusColor/errorColor 可配色(取 "#rrggbb" 真彩或 16 色名如 BrightCyan;
# arrowColor 缺省跟随 highlightColor, 其余缺省不留痕; 示例见下)。sidebarWidth/inputHeight/gpuBackend 亦在此配。
# keys 改快捷键:动作名: 按键串(修饰键 Ctrl/Alt 用 + 连接, 多键序列用空格分隔, 如 "Ctrl+X W");未写的动作用默认键位,TUI 内 /keys 列出全部动作与当前绑定;
# 首键须带 Ctrl/Alt 或为 F 键, 冲突(同一按键串多个动作/一个是另一个的前缀)记 WARN 并回退默认。keySequenceTimeoutMs 为前缀等待超时(毫秒, 缺省 0 = 一直等)。
# web_search 搜索引擎: 模型用 engine 参数选引擎; 省略 engine 时走通用网页搜索 @deepseek-ai/dsh-web-search-deepseek(需在其参数里配 apiKey)。
# GitHub @deepseek-ai/dsh-web-search-github 提供 github-repos(搜仓库)与 github-code(搜代码, 需 token); 参数 token 可选, 不配时仓库搜索每 IP 每分钟 10 次, 配了是 30 次。
# Stack Overflow @deepseek-ai/dsh-web-search-stackoverflow 提供 stackoverflow(搜问题); 参数 key 可选(在 stackapps.com 注册应用获得), 不配时每 IP 每天 300 次, 配了是 10000 次。
# Baidu @deepseek-ai/dsh-web-search-baidu: apiKey 为开通搜索权限的 AppBuilder API Key,最多 50 条网页引用,额度以控制台为准。
# Google @deepseek-ai/dsh-web-search-google: apiKey 与 searchEngineId(cx)均必填;仅既有客户可用至 2027-01-01,每天 100 次免费,单次最多 10 条。
# Bing @deepseek-ai/dsh-web-search-bing: 无 key 的公共 RSS 入口,market 默认不传(由站点选地区);RSS 条款仅限个人非商业阅读,其他用途需 Microsoft 许可。
# DuckDuckGo @deepseek-ai/dsh-web-search-duckduckgo: 无 key 的公共 HTML 入口,region 默认 wt-wt;可能限流或要求人工验证,不会自动解验证码。
# 四个新增引擎均需用 engine 参数点名(或显式设 web.searchProvider),不抢占默认 DeepSeek;均读取 network.outbound_proxy。
# 各插件写 false 即单独关闭;凭据只从本文件读取,不会写进搜索日志或错误信息。
plugins:
  "@deepseek-ai/dsh-memory": false
  "@deepseek-ai/dsh-toon": false
  "@deepseek-ai/dsh-checkpoints": false
  # 下面几段是示例, 默认不打开:
  # "@deepseek-ai/dsh-ide-history":
  #   timeline: true    # 支持IDE(JetBrains/VSCode)历史记录进入timestamp fork/revert/jump时间线，默认为false
  #   timeline_limit: 30
  # "@acme/foo":
  #   enabled: true
  #   permissions:
  #     read: true
  #     write: false
  #     network: true
  # "@deepseek-ai/dsh-tui":
  #   highlightColor: "#7fd1ff"
  #   dividerColor: BrightBlack
  #   statusColor: "#9aa0a6"
  #   errorColor: "#ff6b6b"
  #   keys:
  #     overview: F5
  #     newSession: "Ctrl+X Ctrl+N"
  # "@deepseek-ai/dsh-web-search-github":
  #   token: <GitHub token>    # 可选; 开启 github-code 并提高限流, 只需公开仓库的只读权限
  # "@deepseek-ai/dsh-web-search-stackoverflow":
  #   key: <Stack Exchange key>    # 可选; 提高每日配额
  # "@deepseek-ai/dsh-web-search-stackoverflow": false    # 单独关闭 Stack Overflow 引擎
  # "@deepseek-ai/dsh-web-search-baidu":
  #   apiKey: <AppBuilder API Key>
  # "@deepseek-ai/dsh-web-search-google":
  #   apiKey: <Google API key>
  #   searchEngineId: <cx>
  # "@deepseek-ai/dsh-web-search-bing":
  #   market: zh-CN
  # "@deepseek-ai/dsh-web-search-duckduckgo":
  #   region: cn-zh
  # "@deepseek-ai/dsh-web-search-duckduckgo": false

