# DeepSeek Harness 配置文件模板（settings.yaml v2）
# 首次启动时生成；可手动编辑，注释不会影响运行。

# 全局默认模型，格式为 provider/model
global_default_model: deepseek-official/deepseek-v4-flash

# 压缩（compaction）使用的模型，格式为 provider/model
compaction_model: deepseek-official/deepseek-v4-flash

# 子代理默认模型；未指定 provider/model 时使用，删掉则跟随当前会话
subagent:
  default_model: deepseek-official/deepseek-v4-flash

# LLM 提供方；未配置 key 的 provider 会被跳过
providers:
  deepseek-official:
    # openai-compatible | openai-responses | anthropic | deepseek
    type: openai-compatible
    options:
      # 接口地址
      baseUrl: https://api.deepseek.com
      # API key 环境变量；也可直接写 apiKey
      apiKeyEnv: DEEPSEEK_API_KEY
    # 目录已收录的模型不用列；这里只覆盖显示名/系统提示
    models: {}
  # 私有/中转 provider 示例:
  # "@deepseek-ai/dsh-relay":
  #   type: openai-compatible
  #   options:
  #     baseUrl: https://relay.example.com/v1
  #     apiKey: sk-...
  #   models:
  #     my-model:
  #       name: My Model
  #       tool_call: true

# 技能目录
skills:
  # 本地技能目录
  paths: []
  # 远程技能 URL
  urls: []

# 全局规则文本
rules: []

# 本机 HTTP 出口代理；留空跟随系统代理
# network:
#   # 借用某台机器的出口隧道；null 表示不用
#   borrowed_outbound_machine: null
#   # 代理 URL:http/https/socks4/socks4a/socks5,可带 user:pass@
#   outbound_proxy:
#     url: http://127.0.0.1:7890
#     # 直连主机(含子域)
#     bypass: [example.com, "*.example.org"]
#     # 连通性探测地址
#     probe_url: https://www.gstatic.com/generate_204

# 机器清单；本机(local)隐式存在，不用写
# fleet:
#   machines:
#     - name: build
#       # ssh | local
#       kind: ssh
#       host: build.internal
#       user: dev
#       # agent | key | password
#       auth: key
#       keyPath: ~/.ssh/id_ed25519
#       harnessHome: ~/.dsh-build
#   deploy:
#     # 连接前自动安装/升级远端 dsharp
#     autoDeploy: true
#     releaseVersion: latest
#     # auto | client | server
#     via: auto
#     # 仅远端下载部署包时使用；留空跟随远端代理或直连
#     serverProxy: http://127.0.0.1:7890

# 插件沙箱；false 时保持现有加载/执行方式
sandbox:
  # 是否启用插件沙箱
  enabled: false

# 插件开关:false 关闭;permissions(read/write/network)是保留键
plugins:
  # Debug-only preference for batching independent tool calls in run_code.
  "@deepseek-ai/dsh-ptc":
    debug_batching: false
  # Optional .csx execution requires an installed dotnet-script frontend.
  "@deepseek-ai/dsh-csx":
    executable: dotnet-script
  # Optional C# stdin evaluation requires an installed CSharpRepl frontend.
  "@deepseek-ai/dsh-csharprepl":
    executable: csharprepl
  # 项目记忆；参数 file/backend/capture/mongo
  "@deepseek-ai/dsh-memory": false
  # TOON 编码；参数 output/input
  "@deepseek-ai/dsh-toon": false
  # 快照恢复点；参数 max_points/keep_days
  "@deepseek-ai/dsh-checkpoints": false
  # IDE 集成
  "@deepseek-ai/dsh-ide":
    # 默认编辑器:auto 或编辑器 id
    default_editor: auto
    # 无匹配编辑器时是否失败
    strict_match: false
    # 复用窗口:auto | always | never
    reuse_window: auto
    # 打开后聚焦:never | if_running | always
    focus: never
    # 找不到编辑器时:none | os-default
    fallback: none
    # 允许打开工作区外文件
    allow_outside_workspace: false
    # 事件触发的编辑器规则
    triggers: []
    # 远端工作区到本机目录的映射；留空则不启用 client 打开
    client_mappings: []
    # 编辑器列表;executables 是本机候选,remote_executables 是远端 host 候选
    editors:
      - id: vscode
        display_name: Visual Studio Code
        command: code
        executables: [code, code.exe, code.cmd]
        bundles: [Visual Studio Code]
        history_provider: vscode
        remote: true
        when: {workspace: [.vscode, "*.code-workspace"], extensions: [.cs, .ts, .tsx, .js, .json, .md, .py, .go, .rs, .c, .cpp]}
        actions: {open_file: ["{path}"], open_at_position: ["--goto", "{path}:{line}:{column}"], open_workspace: ["{workspace}"], open_diff: ["--diff", "{left}", "{right}"]}
        remote_actions: {open_file: ["--file-uri", "{remote_uri}"], open_at_position: ["--goto", "--file-uri", "{remote_uri}:{line}:{column}"], open_workspace: ["--folder-uri", "{remote_uri}"]}
        reuse_args: [--reuse-window]
        new_window_args: [--new-window]
      - id: vscode-insiders
        display_name: Visual Studio Code - Insiders
        command: code-insiders
        executables: [code-insiders, code-insiders.exe, code-insiders.cmd]
        bundles: [Visual Studio Code - Insiders]
        history_provider: vscode
        remote: true
        when: {workspace: [.vscode, "*.code-workspace"], extensions: [.cs, .ts, .tsx, .js, .json, .md, .py, .go, .rs, .c, .cpp]}
        actions: {open_file: ["{path}"], open_at_position: ["--goto", "{path}:{line}:{column}"], open_workspace: ["{workspace}"], open_diff: ["--diff", "{left}", "{right}"]}
        remote_actions: {open_file: ["--file-uri", "{remote_uri}"], open_at_position: ["--goto", "--file-uri", "{remote_uri}:{line}:{column}"], open_workspace: ["--folder-uri", "{remote_uri}"]}
        reuse_args: [--reuse-window]
        new_window_args: [--new-window]
      - id: vscodium
        display_name: VSCodium
        command: codium
        executables: [codium, codium.exe, codium.cmd]
        bundles: [VSCodium]
        history_provider: vscode
        remote: true
        when: {workspace: [.vscode, "*.code-workspace"], extensions: [.cs, .ts, .tsx, .js, .json, .md, .py, .go, .rs, .c, .cpp]}
        actions: {open_file: ["{path}"], open_at_position: ["--goto", "{path}:{line}:{column}"], open_workspace: ["{workspace}"], open_diff: ["--diff", "{left}", "{right}"]}
        remote_actions: {open_file: ["--file-uri", "{remote_uri}"], open_at_position: ["--goto", "--file-uri", "{remote_uri}:{line}:{column}"], open_workspace: ["--folder-uri", "{remote_uri}"]}
        reuse_args: [--reuse-window]
        new_window_args: [--new-window]
      - id: cursor
        display_name: Cursor
        command: cursor
        executables: [cursor, cursor.exe, cursor.cmd]
        bundles: [Cursor]
        history_provider: vscode
        remote: true
        when: {workspace: [.vscode, "*.code-workspace"], extensions: [.cs, .ts, .tsx, .js, .json, .md, .py, .go, .rs, .c, .cpp]}
        actions: {open_file: ["{path}"], open_at_position: ["--goto", "{path}:{line}:{column}"], open_workspace: ["{workspace}"], open_diff: ["--diff", "{left}", "{right}"]}
        remote_actions: {open_file: ["--file-uri", "{remote_uri}"], open_at_position: ["--goto", "--file-uri", "{remote_uri}:{line}:{column}"], open_workspace: ["--folder-uri", "{remote_uri}"]}
        reuse_args: [--reuse-window]
        new_window_args: [--new-window]
      - id: windsurf
        display_name: Windsurf
        command: windsurf
        executables: [windsurf, windsurf.exe, windsurf.cmd]
        bundles: [Windsurf]
        history_provider: vscode
        remote: true
        when: {workspace: [.vscode, "*.code-workspace"], extensions: [.cs, .ts, .tsx, .js, .json, .md, .py, .go, .rs, .c, .cpp]}
        actions: {open_file: ["{path}"], open_at_position: ["--goto", "{path}:{line}:{column}"], open_workspace: ["{workspace}"], open_diff: ["--diff", "{left}", "{right}"]}
        remote_actions: {open_file: ["--file-uri", "{remote_uri}"], open_at_position: ["--goto", "--file-uri", "{remote_uri}:{line}:{column}"], open_workspace: ["--folder-uri", "{remote_uri}"]}
        reuse_args: [--reuse-window]
        new_window_args: [--new-window]
      - id: rider
        display_name: Rider
        command: rider
        executables: [rider, rider64.exe, rider.exe, rider.sh]
        bundles: [Rider, Rider CE]
        history_provider: jetbrains
        when: {workspace: [.idea, "*.sln", "*.slnx", "*.iml"], extensions: [.cs, .xaml, .csproj, .fs]}
        actions: {open_file: ["--line", "{line}", "--column", "{column}", "{path}"], open_at_position: ["--line", "{line}", "--column", "{column}", "{path}"], open_workspace: ["{workspace}"]}
      - id: idea
        display_name: IntelliJ IDEA
        command: idea
        executables: [idea, idea64.exe, idea.exe, idea.sh]
        bundles: [IntelliJ IDEA, IntelliJ IDEA CE]
        history_provider: jetbrains
        when: {workspace: [.idea, "*.sln", "*.slnx", "*.iml"], extensions: [.java, .kt, .scala]}
        actions: {open_file: ["--line", "{line}", "--column", "{column}", "{path}"], open_at_position: ["--line", "{line}", "--column", "{column}", "{path}"], open_workspace: ["{workspace}"]}
      - id: pycharm
        display_name: PyCharm
        command: pycharm
        executables: [pycharm, pycharm64.exe, pycharm.exe, pycharm.sh]
        bundles: [PyCharm, PyCharm CE]
        history_provider: jetbrains
        when: {workspace: [.idea, "*.sln", "*.slnx", "*.iml"], extensions: [.py]}
        actions: {open_file: ["--line", "{line}", "--column", "{column}", "{path}"], open_at_position: ["--line", "{line}", "--column", "{column}", "{path}"], open_workspace: ["{workspace}"]}
      - id: webstorm
        display_name: WebStorm
        command: webstorm
        executables: [webstorm, webstorm64.exe, webstorm.exe, webstorm.sh]
        bundles: [WebStorm, WebStorm CE]
        history_provider: jetbrains
        when: {workspace: [.idea, "*.sln", "*.slnx", "*.iml"], extensions: [.ts, .js, .tsx]}
        actions: {open_file: ["--line", "{line}", "--column", "{column}", "{path}"], open_at_position: ["--line", "{line}", "--column", "{column}", "{path}"], open_workspace: ["{workspace}"]}
      - id: clion
        display_name: CLion
        command: clion
        executables: [clion, clion64.exe, clion.exe, clion.sh]
        bundles: [CLion, CLion CE]
        history_provider: jetbrains
        when: {workspace: [.idea, "*.sln", "*.slnx", "*.iml"], extensions: [.c, .cpp, .h, .hpp]}
        actions: {open_file: ["--line", "{line}", "--column", "{column}", "{path}"], open_at_position: ["--line", "{line}", "--column", "{column}", "{path}"], open_workspace: ["{workspace}"]}
      - id: goland
        display_name: GoLand
        command: goland
        executables: [goland, goland64.exe, goland.exe, goland.sh]
        bundles: [GoLand, GoLand CE]
        history_provider: jetbrains
        when: {workspace: [.idea, "*.sln", "*.slnx", "*.iml"], extensions: [.go]}
        actions: {open_file: ["--line", "{line}", "--column", "{column}", "{path}"], open_at_position: ["--line", "{line}", "--column", "{column}", "{path}"], open_workspace: ["{workspace}"]}
      - id: rubymine
        display_name: RubyMine
        command: rubymine
        executables: [rubymine, rubymine64.exe, rubymine.exe, rubymine.sh]
        bundles: [RubyMine, RubyMine CE]
        history_provider: jetbrains
        when: {workspace: [.idea, "*.sln", "*.slnx", "*.iml"], extensions: [.rb]}
        actions: {open_file: ["--line", "{line}", "--column", "{column}", "{path}"], open_at_position: ["--line", "{line}", "--column", "{column}", "{path}"], open_workspace: ["{workspace}"]}
      - id: phpstorm
        display_name: PhpStorm
        command: phpstorm
        executables: [phpstorm, phpstorm64.exe, phpstorm.exe, phpstorm.sh]
        bundles: [PhpStorm, PhpStorm CE]
        history_provider: jetbrains
        when: {workspace: [.idea, "*.sln", "*.slnx", "*.iml"], extensions: [.php]}
        actions: {open_file: ["--line", "{line}", "--column", "{column}", "{path}"], open_at_position: ["--line", "{line}", "--column", "{column}", "{path}"], open_workspace: ["{workspace}"]}
      - id: rustrover
        display_name: RustRover
        command: rustrover
        executables: [rustrover, rustrover64.exe, rustrover.exe, rustrover.sh]
        bundles: [RustRover, RustRover CE]
        history_provider: jetbrains
        when: {workspace: [.idea, "*.sln", "*.slnx", "*.iml"], extensions: [.rs]}
        actions: {open_file: ["--line", "{line}", "--column", "{column}", "{path}"], open_at_position: ["--line", "{line}", "--column", "{column}", "{path}"], open_workspace: ["{workspace}"]}
      - id: datagrip
        display_name: DataGrip
        command: datagrip
        executables: [datagrip, datagrip64.exe, datagrip.exe, datagrip.sh]
        bundles: [DataGrip, DataGrip CE]
        history_provider: jetbrains
        when: {workspace: [.idea, "*.sln", "*.slnx", "*.iml"], extensions: [.sql]}
        actions: {open_file: ["--line", "{line}", "--column", "{column}", "{path}"], open_at_position: ["--line", "{line}", "--column", "{column}", "{path}"], open_workspace: ["{workspace}"]}
      - id: zed
        display_name: Zed
        command: zed
        executables: [zed, zed.exe, zed.cmd]
        bundles: [Zed]
        when: {workspace: [.zed]}
        actions: {open_file: ["{path}:{line}:{column}"], open_at_position: ["{path}:{line}:{column}"], open_workspace: ["{workspace}"]}
        reuse_args: [--reuse]
        new_window_args: [--new]
        background_args: [--background]
      - id: eclipse
        display_name: Eclipse
        command: eclipse
        executables: [eclipse, eclipse.exe, eclipse.cmd]
        bundles: [Eclipse]
        when: {workspace: [.project, .classpath], extensions: [.java]}
        actions: {open_file: ["{path}"], open_workspace: [-data, "{workspace}"]}
      - id: codeblocks
        display_name: CodeBlocks
        command: codeblocks
        executables: [codeblocks, codeblocks.exe, codeblocks.cmd]
        bundles: [CodeBlocks]
        when: {workspace: ["*.cbp"], extensions: [.c, .cpp, .h, .hpp]}
        actions: {open_file: ["{path}"], open_workspace: ["{workspace}"]}
      - id: vim
        display_name: vim
        kind: terminal
        command: vim
        executables: [vim, vim.exe, vim.cmd]
        when: {extensions: [.vim]}
        actions: {open_file: ["+call cursor({line},{column})", "{path}"], open_at_position: ["+call cursor({line},{column})", "{path}"], open_workspace: ["{workspace}"]}
      - id: nvim
        display_name: nvim
        kind: terminal
        command: nvim
        executables: [nvim, nvim.exe, nvim.cmd]
        when: {extensions: [.vim, .lua]}
        actions: {open_file: ["+call cursor({line},{column})", "{path}"], open_at_position: ["+call cursor({line},{column})", "{path}"], open_workspace: ["{workspace}"]}
      - id: emacs
        display_name: Emacs
        command: emacsclient
        executables: [emacsclient, emacsclient.exe]
        bundles: [Emacs]
        when: {extensions: [.el]}
        actions: {open_file: [-c, "--alternate-editor=", "+{line}:{column}", "{path}"], open_at_position: [-c, "--alternate-editor=", "+{line}:{column}", "{path}"], open_workspace: [-c, "--alternate-editor=", "{workspace}"]}
      - id: emacs-terminal
        display_name: emacs-terminal
        kind: terminal
        command: emacsclient
        executables: [emacsclient, emacsclient.exe, emacsclient.cmd]
        when: {extensions: [.el]}
        actions: {open_file: [-t, "--alternate-editor=", "+{line}:{column}", "{path}"], open_at_position: [-t, "--alternate-editor=", "+{line}:{column}", "{path}"], open_workspace: [-t, "--alternate-editor=", "{workspace}"]}
      - id: sublime
        display_name: Sublime Text
        command: subl
        executables: [subl, subl.exe, subl.cmd]
        bundles: [Sublime Text]
        when: {workspace: ["*.sublime-project"]}
        actions: {open_file: ["{path}:{line}:{column}"], open_at_position: ["{path}:{line}:{column}"], open_workspace: ["{workspace}"]}
        reuse_args: [--add]
        new_window_args: [--new-window]
        background_args: [--background]
      - id: visualstudio
        display_name: visualstudio
        command: devenv.exe
        executables: [devenv.exe]
        when: {workspace: ["*.sln", "*.slnx"], extensions: [.cs, .cpp, .vb, .fs]}
        actions: {open_file: [/Edit, "{path}"], open_workspace: ["{workspace}"]}
        discovery_commands:
          - platform: windows
            command: "{program_files_x86}/Microsoft Visual Studio/Installer/vswhere.exe"
            args: [-latest, -products, "*", -property, productPath]
    # 进程环境变量到编辑器的识别规则；第一条匹配生效
    host_detection:
      - {editor: cursor, variable: VSCODE_IPC_HOOK_CLI, pattern: "*Cursor*"}
      - {editor: windsurf, variable: VSCODE_IPC_HOOK_CLI, pattern: "*Windsurf*"}
      - {editor: vscodium, variable: VSCODE_IPC_HOOK_CLI, pattern: "*VSCodium*"}
      - {editor: vscode-insiders, variable: VSCODE_IPC_HOOK_CLI, pattern: "*Code - Insiders*"}
      - {editor: vscode, variable: VSCODE_PID}
      - {editor: vscode, variable: TERM_PROGRAM, pattern: vscode}
      - {editor: zed, variable: ZED_TERM}
      - {editor: zed, variable: TERM_PROGRAM, pattern: zed}
      - {editor: rider, variable: JETBRAINS_IDE, pattern: "*rider*"}
      - {editor: idea, variable: JETBRAINS_IDE, pattern: "*idea*"}
      - {editor: pycharm, variable: JETBRAINS_IDE, pattern: "*pycharm*"}
      - {editor: webstorm, variable: JETBRAINS_IDE, pattern: "*webstorm*"}
      - {editor: clion, variable: JETBRAINS_IDE, pattern: "*clion*"}
      - {editor: goland, variable: JETBRAINS_IDE, pattern: "*goland*"}
      - {editor: rustrover, variable: JETBRAINS_IDE, pattern: "*rustrover*"}
      - {editor: phpstorm, variable: JETBRAINS_IDE, pattern: "*phpstorm*"}
      - {editor: rubymine, variable: JETBRAINS_IDE, pattern: "*rubymine*"}
      - {editor: datagrip, variable: JETBRAINS_IDE, pattern: "*datagrip*"}
    # 额外的编辑器安装目录；{id}/{display_name}/{home}/{program_files} 等占位符
    installation_roots:
      linux:
        - /usr/bin
        - /usr/local/bin
        - /snap/bin
        - "/opt/{id}"
        - "/opt/{id}/bin"
        - "/opt/jetbrains/{id}/bin"
        - "{home}/.local/bin"
        - "{home}/.local/share/JetBrains/Toolbox/scripts"
        - "{home}/.local/share/JetBrains/Toolbox/apps/*{id}*/bin"
        - "{home}/.local/share/JetBrains/Toolbox/apps/*{id}*/*/bin"
        - "{home}/.local/share/JetBrains/Toolbox/apps/*{id}*/*/*/bin"
      macos:
        - /usr/bin
        - /usr/local/bin
        - "/opt/{id}/bin"
        - "{home}/.local/bin"
        - "{home}/Library/Application Support/JetBrains/Toolbox/scripts"
        - "{home}/Library/Application Support/JetBrains/Toolbox/apps/*{id}*/bin"
        - "{home}/Library/Application Support/JetBrains/Toolbox/apps/*{id}*/*/bin"
        - "{home}/Library/Application Support/JetBrains/Toolbox/apps/*{id}*/*/*/bin"
      windows:
        - "{local_app_data}/Programs/{display_name}/bin"
        - "{local_app_data}/Programs/{display_name}"
        - "{local_app_data}/JetBrains/Toolbox/scripts"
        - "{local_app_data}/JetBrains/Toolbox/apps/*{id}*/bin"
        - "{local_app_data}/JetBrains/Toolbox/apps/*{id}*/*/bin"
        - "{local_app_data}/JetBrains/Toolbox/apps/*{id}*/*/*/bin"
        - "{program_files}/{display_name}"
        - "{program_files_x86}/{display_name}"
        - "{program_files}/JetBrains/{display_name}*/bin"
        - "{program_files}/CodeBlocks"
        - "{program_files}/Eclipse"
        - "{program_files}/Neovim/bin"
        - "{program_files}/Vim/*"
        - "{program_files}/Emacs/*/bin"
        - "{program_files}/Sublime Text"
        - "{local_app_data}/Programs/Microsoft VS Code/bin"
        - "{local_app_data}/Programs/Microsoft VS Code Insiders/bin"
        - "{program_files}/Microsoft VS Code/bin"
    # macOS 应用包目录
    bundle_roots: ["/Applications", "{home}/Applications"]
    # Linux .desktop 目录
    desktop_roots: ["/usr/share/applications", "/usr/local/share/applications", "{home}/.local/share/applications"]
    # IDE 历史来源
    history:
      # 启用的历史提供方
      providers: [vscode, jetbrains, zed]
      # 是否读取时间线
      timeline: false
      # 时间线条目上限
      timeline_limit: 50
      # 时间线窗口秒数
      window_seconds: 60
      # 各提供方的存储位置
      discovery:
        vscode:
          # 用户配置目录
          roots:
            linux: ["{home}/.config/Code/User", "{home}/.config/Code - Insiders/User", "{home}/.config/Code - OSS/User", "{home}/.config/VSCodium/User", "{home}/.vscode-server/data/User"]
            macos: ["{home}/Library/Application Support/Code/User", "{home}/Library/Application Support/Code - Insiders/User", "{home}/Library/Application Support/Code - OSS/User", "{home}/Library/Application Support/VSCodium/User"]
            windows: ["{app_data}/Code/User", "{app_data}/Code - Insiders/User", "{app_data}/Code - OSS/User", "{app_data}/VSCodium/User"]
          # 历史存储子目录
          store_paths: [History]
          # 设置文件名
          settings_file: settings.json
        jetbrains:
          # 用户配置目录
          roots:
            linux: ["{home}/.cache/JetBrains"]
            macos: ["{home}/Library/Caches/JetBrains"]
            windows: ["{local_app_data}/JetBrains"]
          # 历史存储子目录
          store_paths: [LocalHistory/changes.storageData, LocalHistory/changes/changes.storageData]
  # 下面几段是示例, 默认不打开:
  # 自定义插件示例:
  # "@acme/foo":
  #   enabled: true
  #   permissions:
  #     read: true
  #     write: false
  #     network: true
  # TUI 配色与快捷键示例:
  # "@deepseek-ai/dsh-tui":
  #   highlightColor: "#7fd1ff"
  #   dividerColor: BrightBlack
