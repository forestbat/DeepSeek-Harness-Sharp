name: 构建校验

# Keep a lightweight result for every push/PR so skipped heavy jobs do not leave required checks pending.
# Merges are checked by the master push event rather than a second pull_request.closed run.
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      aot:
        description: '同时构建 AOT 档（Windows + Linux）'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: 判定受影响校验
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tests: ${{ steps.select.outputs.tests }}
      suites: ${{ steps.select.outputs.suites }}
      jit: ${{ steps.select.outputs.jit }}
      aot: ${{ steps.select.outputs.aot }}
      validate: ${{ steps.select.outputs.validate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.number) || github.sha }}
          fetch-depth: 0
      - name: 校验检出提交包含当前 PR head
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git merge-base --is-ancestor "$EXPECTED_HEAD_SHA" HEAD
      - name: 根据变更选择作业
        id: select
        shell: bash
        run: >
          python3 scripts/select-ci.py
          --event '${{ github.event_name }}'
          --base '${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}'
          --head HEAD
          --aot '${{ inputs.aot == true }}'
          --output "$GITHUB_OUTPUT"

  validate:
    name: 工作流与选测规则校验
    needs: changes
    if: needs.changes.outputs.validate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.number) || github.sha }}
          fetch-depth: 0
      - name: 校验检出提交包含当前 PR head
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git merge-base --is-ancestor "$EXPECTED_HEAD_SHA" HEAD
      - uses: docker://rhysd/actionlint:1.7.12
      - name: 验证变更选择边界
        run: python3 -m unittest discover -s tests/ci -v

  iroh-component:
    name: 准备真实 Iroh 测试夹具（${{ matrix.rid }}）
    needs: changes
    if: needs.changes.outputs.tests == 'true' && contains(fromJSON(needs.changes.outputs.suites), 'quick')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.number) || github.sha }}
          fetch-depth: 0
      - name: 校验检出提交包含当前 PR head
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git merge-base --is-ancestor "$EXPECTED_HEAD_SHA" HEAD
      - name: 缓存固定源码构建的 iroh-ssh
        id: iroh-cache
        uses: actions/cache@v4
        with:
          path: artifacts/iroh-ssh-component.tar
          key: iroh-ssh-test-tar-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-iroh-ssh.*', 'scripts/iroh-ssh-readiness.patch', 'scripts/iroh-ssh.NOTICE.txt') }}
      - name: 解包已缓存的原生组件
        if: steps.iroh-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/iroh-ssh | Out-Null
          $tar = if ($IsWindows) { Join-Path ([Environment]::GetFolderPath('System')) 'tar.exe' } else { 'tar' }
          & $tar -xf artifacts/iroh-ssh-component.tar -C artifacts/iroh-ssh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Cold native compilation happens once per platform, outside consumer budgets.
      - name: 构建固定源码的原生组件
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -NoProfile -File scripts/fetch-iroh-ssh.ps1 -Rid "${{ matrix.rid }}"
          else
            bash scripts/fetch-iroh-ssh.sh "${{ matrix.rid }}"
          fi
      - name: 校验 macOS 原生可执行文件的本地网络用途声明
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          otool -X -P artifacts/iroh-ssh/osx-arm64/iroh-ssh > artifacts/iroh-ssh.Info.plist
          plutil -lint artifacts/iroh-ssh.Info.plist
          plutil -extract NSLocalNetworkUsageDescription raw artifacts/iroh-ssh.Info.plist
          plutil -extract NSBonjourServices.0 raw artifacts/iroh-ssh.Info.plist
      - name: 打包原生组件（保留 Unix 执行权限）
        shell: pwsh
        run: |
          $rid = '${{ matrix.rid }}'
          $files = @(Get-ChildItem -LiteralPath "artifacts/iroh-ssh/$rid" -File |
            Where-Object { $_.Name -notin @('source.tar.gz', '.acquire.lock') } |
            ForEach-Object { "$rid/$($_.Name)" })
          $tar = if ($IsWindows) { Join-Path ([Environment]::GetFolderPath('System')) 'tar.exe' } else { 'tar' }
          & $tar -cf artifacts/iroh-ssh-component.tar -C artifacts/iroh-ssh @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: iroh-ssh-${{ matrix.os }}
          path: artifacts/iroh-ssh-component.tar
          if-no-files-found: error
          retention-days: 7

  test:
    name: 测试（${{ matrix.platform.os }}，${{ matrix.suite }}）
    needs: [changes, iroh-component]
    if: ${{ !cancelled() && needs.changes.outputs.tests == 'true' && (needs.iroh-component.result == 'success' || needs.iroh-component.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: windows-latest
            native-cc: cl
            native-cc-alt: clang-cl
          - os: ubuntu-latest
            native-cc: clang
            native-cc-alt: ''
          - os: macos-latest
            native-cc: clang
            native-cc-alt: ''
        suite: ${{ fromJSON(needs.changes.outputs.suites) }}
        exclude:
          - platform:
              os: windows-latest
              native-cc: cl
              native-cc-alt: clang-cl
            suite: raw
          - platform:
              os: macos-latest
              native-cc: clang
              native-cc-alt: ''
            suite: quick
    uses: ./.github/workflows/ci-tests.yml
    with:
      os: ${{ matrix.platform.os }}
      native-cc: ${{ matrix.platform.native-cc }}
      native-cc-alt: ${{ matrix.platform.native-cc-alt }}
      suite: ${{ matrix.suite }}
      quick-cohort: all

  test-macos-quick:
    name: 测试（macos-latest，quick-${{ matrix.cohort }}）
    needs: [changes, iroh-component]
    if: ${{ !cancelled() && needs.changes.outputs.tests == 'true' && contains(fromJSON(needs.changes.outputs.suites), 'quick') && (needs.iroh-component.result == 'success' || needs.iroh-component.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        cohort: [fleet-iroh, remainder]
    uses: ./.github/workflows/ci-tests.yml
    with:
      os: macos-latest
      native-cc: clang
      suite: quick
      quick-cohort: ${{ matrix.cohort }}

  build:
    name: 三入口发布验收（${{ matrix.rid }}，JIT）
    needs: changes
    if: needs.changes.outputs.jit == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            native-cc: cl
          - os: ubuntu-latest
            rid: linux-x64
            native-cc: clang
          - os: macos-latest
            rid: osx-arm64
            native-cc: clang
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.number) || github.sha }}
          fetch-depth: 0
      - name: 校验检出提交包含当前 PR head
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git merge-base --is-ancestor "$EXPECTED_HEAD_SHA" HEAD
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: 准备本地 NuGet feed（packages/，DryIoc.dll）
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -NoProfile -File scripts/fetch-dryioc-feed.ps1 -UseGhArtifact
          else
            bash scripts/fetch-dryioc-feed.sh --use-gh-artifact
          fi
      - name: 依次发布三个入口并校验原生故障遏制库（Release + 裁剪 + 自包含）
        shell: bash
        run: |
          set -euo pipefail
          for PROJECT in DeepSeek-Harness-Sharp Dsh.GuiHost Dsh.WebHost; do
            dotnet publish "$PROJECT/$PROJECT.csproj" \
              -c Release -r ${{ matrix.rid }} \
              -p:DebugSymbols=false -p:DebugType=none \
              -p:DshNativeCompiler=${{ matrix.native-cc }} \
              --nologo -v m
            PUB="$PROJECT/bin/Release/net10.0/${{ matrix.rid }}/publish"
            if find "$PUB" -type f \( -name iroh-ssh -o -name iroh-ssh.exe \) -print -quit | grep -q .; then
              echo "::error::$PROJECT must not bundle the optional native Iroh command"
              exit 1
            fi
            printf '%s\n' "$PUB"/* | grep -E '/(lib)?dsh_plugin_guard\.(dll|so|dylib)$' || { echo "::error::$PROJECT 发布产物缺少 dsh_plugin_guard"; exit 1; }
          done
      - name: GUI 主线程冒烟（macOS）
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          PUB="Dsh.GuiHost/bin/Release/net10.0/${{ matrix.rid }}/publish"
          EXE="$PUB/dsh-gui"
          test -f "$EXE" || { echo "::error::找不到 $EXE"; exit 1; }
          chmod +x "$EXE"
          mkdir -p artifacts/gui-smoke
          DSH_HOME="$(mktemp -d "$PWD/artifacts/gui-smoke/homeXXXXXX")" "$EXE" > gui-smoke.out 2>&1 &
          GUIPID=$!
          ( sleep 30; kill -9 "$GUIPID" 2>/dev/null ) &
          WATCH=$!
          set +e
          wait "$GUIPID"
          kill "$WATCH" 2>/dev/null || true
          set -e
          cat gui-smoke.out || true
          if grep -q "IDispatcherImpl belongs to a different thread" gui-smoke.out; then
            echo "::error::macOS GUI 仍在子线程初始化 Avalonia"
            exit 1
          fi
          echo "macOS GUI 冒烟通过（未见 Dispatcher 主线程异常）"
      - name: 同一产品三入口真实 WebHost 与隔离验收
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -File scripts/smoke-web-host.ps1 \
            -WebPublishDir "Dsh.WebHost/bin/Release/net10.0/${{ matrix.rid }}/publish" \
            -TuiPublishDir "DeepSeek-Harness-Sharp/bin/Release/net10.0/${{ matrix.rid }}/publish" \
            -GuiPublishDir "Dsh.GuiHost/bin/Release/net10.0/${{ matrix.rid }}/publish"
      - name: 归档三个入口的独立完整发布根
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          TAR="tar"
          if [ "$RUNNER_OS" = "Windows" ]; then
            TAR="$(cygpath -u "$WINDIR")/System32/tar.exe"
          fi
          "$TAR" -cf "artifacts/${{ matrix.rid }}-cli.tar" -C "DeepSeek-Harness-Sharp/bin/Release/net10.0/${{ matrix.rid }}/publish" .
          "$TAR" -cf "artifacts/${{ matrix.rid }}-gui.tar" -C "Dsh.GuiHost/bin/Release/net10.0/${{ matrix.rid }}/publish" .
          "$TAR" -cf "artifacts/${{ matrix.rid }}-web.tar" -C "Dsh.WebHost/bin/Release/net10.0/${{ matrix.rid }}/publish" .
      - uses: actions/upload-artifact@v4
        with:
          name: jit-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}-*.tar
          if-no-files-found: error
          retention-days: 1


  aot:
    name: AOT 构建（${{ matrix.rid }}）
    needs: changes
    if: needs.changes.outputs.aot == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            native-cc: cl
          - os: ubuntu-latest
            rid: linux-x64
            native-cc: clang
    uses: ./.github/workflows/ci-aot.yml
    with:
      os: ${{ matrix.os }}
      rid: ${{ matrix.rid }}
      native-cc: ${{ matrix.native-cc }}

  result:
    name: CI 结果
    needs: [changes, validate, iroh-component, test, test-macos-quick, build, aot]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 汇总必需校验结果
        shell: bash
        run: |
          if [ '${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}' = 'true' ]; then
            echo '::error::受影响的 CI 校验失败或被取消'
            exit 1
          fi
          echo '受影响的 CI 校验全部通过；不相关的校验已跳过'
