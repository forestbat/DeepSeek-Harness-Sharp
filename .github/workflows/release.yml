name: 发布 Release（JIT + AOT）

# 只在明确的发布点触发，日常提交不会发 Release：
#   1) push 形如 v0.1.1 的版本 tag；
#   2) 手动 workflow_dispatch（要求 tag 已先推送到仓库，也可只干跑不发布）。
# 每次发布同时产出 JIT 与 AOT 两档(与 ci.yml 不同: ci.yml 只在合入/手动时校验 AOT)。
# JIT 资产保持 dsharp-<rid> 的旧名(远端自动部署按此名下载), AOT 资产带 -aot 后缀。
# 发布说明由 GitHub 自动生成（--generate-notes），不在仓库里维护手写前端。
# 发布前先跑一遍测试（排除需要 GPU/桌面/外部模型的类别），测试不过就不构建、不发布。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的 tag（如 v0.1.1）；请先把 tag 推到仓库'
        required: true
      dry_run:
        description: '只构建与打包，不创建/更新 Release'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 判定发布点
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      - id: detect
        name: 解析 tag
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          IN_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            TAG="$IN_TAG"
          else
            TAG="$REF_NAME"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::没有解析到 tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"

  test:
    name: 测试（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        # 原生库(guard 与 fault probe)的 C 编译器驱动, 经 -p:DshNativeCompiler 交给 PluginGuard.props。
        # Windows 主构建用发布所用的 MSVC(cl), 再用 clang-cl 重建并重跑原生遏制回归。
        include:
          - os: windows-latest
            native-cc: cl
            native-cc-alt: clang-cl
          - os: ubuntu-latest
            native-cc: clang
          - os: macos-latest
            native-cc: clang
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Provision the explicit patched native Iroh test dependency
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Windows)
              RID=win-x64
              pwsh -NoProfile -File scripts/fetch-iroh-ssh.ps1 -Rid "$RID"
              DIRECTORY="$(cygpath -w "$PWD/artifacts/iroh-ssh/$RID")"
              ;;
            Linux)
              RID=linux-x64
              bash scripts/fetch-iroh-ssh.sh "$RID"
              DIRECTORY="$PWD/artifacts/iroh-ssh/$RID"
              ;;
            macOS)
              RID=osx-arm64
              bash scripts/fetch-iroh-ssh.sh "$RID"
              DIRECTORY="$PWD/artifacts/iroh-ssh/$RID"
              ;;
            *) exit 1 ;;
          esac
          printf '%s\n' "$DIRECTORY" >> "$GITHUB_PATH"

      - name: Validate the installed native Iroh test dependency
        shell: bash
        run: |
          set -euo pipefail
          command -v iroh-ssh
          iroh-ssh version
          iroh-ssh server --help | grep -F -- --ready-file

      - name: 准备本地 NuGet feed（packages/，DryIoc.dll）
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -NoProfile -File scripts/fetch-dryioc-feed.ps1 -UseGhArtifact
          else
            bash scripts/fetch-dryioc-feed.sh --use-gh-artifact
          fi

      - name: 检查 C 工具链（Clang/LLVM；Windows 另需 MSVC）
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            if ! command -v clang-cl >/dev/null 2>&1; then
              choco install llvm --no-progress -y
              printf '%s\n' 'C:\Program Files\LLVM\bin' >> "$GITHUB_PATH"
              export PATH="/c/Program Files/LLVM/bin:$PATH"
            fi
            clang-cl --version
            "/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' \
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'Common7\Tools\VsDevCmd.bat'
          else
            if ! command -v clang >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends clang
            fi
            clang --version
          fi

      - name: 编译测试工程（Debug，含插件夹具与 fault probe）
        run: >
          dotnet build tests/Dsh.Tests/Dsh.Tests.csproj -c Debug --nologo
          -p:DshNativeCompiler=${{ matrix.native-cc }}

      - name: Check macOS non-admin headless SSH LAN receiver
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/test-iroh-macos-lan.sh

      - name: 运行测试（排除 GpuStress / OnlyGpu / LlmSmoke / RenderBench）
        shell: bash
        run: |
          set -euo pipefail
          # GpuStress 需要真实 GPU 压测；OnlyGpu 是功能性的 GPU/桌面渲染用例(无 GPU/EGL 的 runner 跑不了)；
          # RenderBench 需要桌面渲染环境；LlmSmoke 需要外部模型接口与密钥。
          EXE="tests/Dsh.Tests/bin/Debug/net10.0/Dsh.Tests"
          if [ ! -x "$EXE" ]; then
            EXE="$EXE.exe"
          fi
          ARGS=("$EXE" -noColor
            -trait- "Category=GpuStress"
            -trait- "Category=OnlyGpu"
            -trait- "Category=LlmSmoke"
            -trait- "Category=RenderBench")
          if [ "$RUNNER_OS" = "macOS" ]; then
            ARGS+=(-method- Dsh.Tests.IrohReceiverEndToEndTests.TargetCli_Lan_Readiness_And_Restart_Work_Without_A_Relay)
          fi
          if command -v timeout >/dev/null 2>&1; then
            ARGS=(timeout 900 "${ARGS[@]}")
          fi
          echo "运行: ${ARGS[*]}"
          "${ARGS[@]}"

      - name: 原生遏制回归（NativeGuardTests，${{ matrix.native-cc }}，跳过即失败）
        shell: bash
        run: |
          set -euo pipefail
          EXE="tests/Dsh.Tests/bin/Debug/net10.0/Dsh.Tests"
          if [ ! -x "$EXE" ]; then
            EXE="$EXE.exe"
          fi
          "$EXE" -noColor -class Dsh.Tests.NativeGuardTests -failSkips

      - name: 换用 ${{ matrix.native-cc-alt }} 重建原生库并重跑原生遏制回归
        if: matrix.native-cc-alt != ''
        shell: bash
        run: |
          set -euo pipefail
          dotnet build tests/Dsh.Tests/Dsh.Tests.csproj -c Debug --nologo \
            -p:DshNativeCompiler=${{ matrix.native-cc-alt }} "-flp:verbosity=normal;logfile=native-alt.log"
          # 构建日志里的编译命令证明 guard 与 probe 确由替换后的驱动重建。
          grep -E '${{ matrix.native-cc-alt }} /nologo' native-alt.log
          tests/Dsh.Tests/bin/Debug/net10.0/Dsh.Tests.exe -noColor -class Dsh.Tests.NativeGuardTests -failSkips

  build:
    name: 构建 ${{ matrix.flavor }} / ${{ matrix.rid }}
    needs: [prepare, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            flavor: jit
            archive: dsharp-win-x64.zip
            native-cc: cl
          - os: windows-latest
            rid: win-x64
            flavor: aot
            archive: dsharp-win-x64-aot.zip
            native-cc: cl
          - os: ubuntu-latest
            rid: linux-x64
            flavor: jit
            archive: dsharp-linux-x64.tar.gz
            native-cc: clang
          - os: ubuntu-latest
            rid: linux-x64
            flavor: aot
            archive: dsharp-linux-x64-aot.tar.gz
            native-cc: clang
          - os: macos-latest
            rid: osx-arm64
            flavor: jit
            archive: dsharp-osx-arm64.tar.gz
            native-cc: clang
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: 准备本地 NuGet feed（packages/，DryIoc.dll）
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -NoProfile -File scripts/fetch-dryioc-feed.ps1 -UseGhArtifact
          else
            bash scripts/fetch-dryioc-feed.sh --use-gh-artifact
          fi

      - name: 安装 Clang/LLVM 工具链（Linux；原生库与 AOT 链接共用）
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld zlib1g-dev

      - name: 发布产物（Release，自包含 + 裁剪）
        shell: bash
        env:
          FLAVOR: ${{ matrix.flavor }}
          RID: ${{ matrix.rid }}
          TAG: ${{ needs.prepare.outputs.tag }}
          NATIVE_CC: ${{ matrix.native-cc }}
        run: |
          set -euo pipefail
          # 程序集版本随 tag: 远端部署判据比较的就是它, 必须与发布的 tag 一致。
          VERSION="${TAG#v}"
          PUBLISH_ARGS=(-p:DshNativeCompiler="$NATIVE_CC")
          if [ "$FLAVOR" = "aot" ]; then
            # AOT 产物附带 fault probe, 供在目标机上回归 guard 的遏制。
            PUBLISH_ARGS+=(-p:PublishAot=true -p:DshShipFaultProbe=true)
          fi
          # 不指定 PublishDir，使用默认发布目录，避免 bash/Windows 路径转换问题。
          # DebugType=none：发布档不需要调试符号（AOT 的 pdb 单独就有数百 MB）。
          dotnet publish DeepSeek-Harness-Sharp/DeepSeek-Harness-Sharp.csproj \
            -c Release -r "$RID" "${PUBLISH_ARGS[@]}" \
            -p:Version="$VERSION" -p:DebugSymbols=false -p:DebugType=none \
            --nologo -v m
          # GUI 启动器一并发布并叠加进主产物。
          dotnet publish DshGuiHost/DshGuiHost.csproj -c Release -r "$RID" "${PUBLISH_ARGS[@]}" \
            -p:Version="$VERSION" -p:DebugSymbols=false -p:DebugType=none --nologo -v m
          # The Web entry keeps its runtime closure in a separate optional asset.
          dotnet publish Dsh.WebHost/Dsh.WebHost.csproj -c Release -r "$RID" "${PUBLISH_ARGS[@]}" \
            -p:Version="$VERSION" -p:DebugSymbols=false -p:DebugType=none --nologo -v m
          WEB_PUB="Dsh.WebHost/bin/Release/net10.0/$RID/publish"
          if [ "$FLAVOR" = "aot" ]; then
            bash scripts/assert-aot-output.sh "$WEB_PUB" dsharp-web
          fi
          pwsh -NoProfile -File scripts/smoke-web-host.ps1 \
            -WebPublishDir "$WEB_PUB" \
            -TuiPublishDir "DeepSeek-Harness-Sharp/bin/Release/net10.0/$RID/publish" \
            -GuiPublishDir "DshGuiHost/bin/Release/net10.0/$RID/publish"
          PUB="DeepSeek-Harness-Sharp/bin/Release/net10.0/$RID/publish"
          GUI_PUB="DshGuiHost/bin/Release/net10.0/$RID/publish"
          test -d "$PUB"
          test -d "$GUI_PUB"
          cp -R "$GUI_PUB"/. "$PUB"/
          rm -f "$PUB"/dsh-gui*.pdb "$PUB"/dsh-gui*.dbg
          STAGE="artifacts/release-stage/$FLAVOR-$RID"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/plugins"
          cp -R "$PUB/." "$STAGE/"
          for DISTRIBUTION in "$STAGE" "$WEB_PUB"; do
            if find "$DISTRIBUTION" -type f \( -name iroh-ssh -o -name iroh-ssh.exe \) -print -quit | grep -q .; then
              echo "::error::Release products must not bundle the optional native Iroh command"
              exit 1
            fi
          done
          NATIVES=(dsh_plugin_guard)
          if [ "$FLAVOR" = "aot" ]; then
            # 结构特征判别是否真的 AOT：JIT 发布同样会产出 apphost，光看文件存在拦不住。
            bash scripts/assert-aot-output.sh "$STAGE"
            NATIVES+=(dsh_fault_probe)
          fi
          for NATIVE in "${NATIVES[@]}"; do
            printf '%s\n' "$STAGE"/* | grep -E "/(lib)?$NATIVE\.(dll|so|dylib)$" || { echo "::error::产物缺少 $NATIVE"; exit 1; }
          done
          # 调试旁文件不进产物（AOT 的 .pdb/.dbg 动辄数百 MB）。
          rm -f "$STAGE"/*.pdb "$STAGE"/*.dbg
          echo "staging 文件数: $(find "$STAGE" -type f | wc -l)"
          echo "staging 体积: $(du -sh "$STAGE" | cut -f1)"

      - name: 打包并校验（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          FLAVOR: ${{ matrix.flavor }}
          RID: ${{ matrix.rid }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = "artifacts/release-stage/$env:FLAVOR-$env:RID"
          New-Item -ItemType Directory -Force "$stage/plugins" | Out-Null
          $out = "artifacts/release-stage/$env:ARCHIVE"
          Remove-Item -Force $out -ErrorAction SilentlyContinue
          # Windows 自带的 tar 是 bsdtar：-a 按扩展名生成 zip，且会保留空目录条目（plugins/）。
          tar.exe -a -c -f $out --exclude=*.pdb --exclude=*.dbg -C $stage .
          if ($LASTEXITCODE -ne 0) { throw "打包失败" }
          $entries = tar.exe -tf $out
          $junk = @($entries | Where-Object { $_ -match '\.(pdb|dbg)$' })
          if ($junk.Count -ne 0) { throw "归档里不该有调试符号：$($junk -join ', ')" }
          if (-not ($entries -match '^\./plugins/$')) { throw "归档缺少 plugins/ 目录条目" }
          $verify = Join-Path $env:RUNNER_TEMP "verify-$env:FLAVOR-$env:RID"
          Remove-Item -Recurse -Force $verify -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $out -DestinationPath $verify -Force
          if (-not (Test-Path "$verify/dsharp.exe")) { throw "归档里找不到 dsharp.exe" }
          if (-not (Test-Path "$verify/dsh-gui.exe")) { throw "归档里找不到 dsh-gui.exe" }
          if (-not (Test-Path "$verify/plugins")) { throw "归档里找不到 plugins/" }
          $env:DSH_HOME = Join-Path $env:RUNNER_TEMP "dsh-home-$env:FLAVOR-$env:RID"
          $proc = Start-Process -FilePath "$verify/dsharp.exe" -ArgumentList @('--help') -NoNewWindow -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/smoke.out" -RedirectStandardError "$env:RUNNER_TEMP/smoke.err"
          if (-not $proc.WaitForExit(60000)) { $proc.Kill($true); throw "冒烟超时" }
          if ($proc.ExitCode -ne 0) { throw "冒烟失败，exit=$($proc.ExitCode)" }
          Write-Host "归档校验通过：$env:ARCHIVE"

      - name: 打包并校验（POSIX）
        if: runner.os != 'Windows'
        shell: bash
        env:
          FLAVOR: ${{ matrix.flavor }}
          RID: ${{ matrix.rid }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          STAGE="artifacts/release-stage/$FLAVOR-$RID"
          mkdir -p "$STAGE/plugins"
          OUT="artifacts/release-stage/$ARCHIVE"
          rm -f "$OUT"
          tar -czf "$OUT" --exclude='*.pdb' --exclude='*.dbg' -C "$STAGE" .
          # 先把清单读进变量再用 grep: grep -q 命中即退出会让 tar 吃到 SIGPIPE, 在 set -o pipefail 下被误判为失败。
          ENTRIES="$(tar -tzf "$OUT")"
          if grep -qE '\.(pdb|dbg)$' <<<"$ENTRIES"; then
            echo "::error::归档里不该有调试符号"
            exit 1
          fi
          grep -qx './plugins/' <<<"$ENTRIES" || { echo "::error::归档缺少 plugins/ 目录条目"; exit 1; }
          VERIFY="$(mktemp -d)"
          tar -xzf "$OUT" -C "$VERIFY"
          test -f "$VERIFY/dsharp" || { echo "::error::归档里找不到 dsharp"; exit 1; }
          test -f "$VERIFY/dsh-gui" || { echo "::error::归档里找不到 dsh-gui"; exit 1; }
          test -d "$VERIFY/plugins" || { echo "::error::归档里找不到 plugins/"; exit 1; }
          chmod +x "$VERIFY/dsharp"
          cd "$VERIFY"
          # macOS 自带 bash 3.2 且没有 GNU timeout(只有 gtimeout 或都没有): 有就加超时, 没有就直接跑。
          TIMEOUT_CMD=""
          if command -v timeout >/dev/null 2>&1; then TIMEOUT_CMD="timeout 60"
          elif command -v gtimeout >/dev/null 2>&1; then TIMEOUT_CMD="gtimeout 60"
          fi
          # shellcheck disable=SC2086  # 这里就是要让 TIMEOUT_CMD 按词展开(空串即不加超时)
          DSH_HOME="$VERIFY/dsh-home" $TIMEOUT_CMD ./dsharp --help > "$VERIFY/smoke.out" 2>&1 || {
            echo "::error::冒烟失败"; tail -20 "$VERIFY/smoke.out"; exit 1; }
          cd - >/dev/null
          rm -rf "$VERIFY"
          echo "归档校验通过：$ARCHIVE"

      - name: 单独打包和冒烟 WebHost
        shell: pwsh
        env:
          FLAVOR: ${{ matrix.flavor }}
          RID: ${{ matrix.rid }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          $ErrorActionPreference = 'Stop'
          $webPub = "Dsh.WebHost/bin/Release/net10.0/$env:RID/publish"
          $webArchive = $env:ARCHIVE -replace '^dsharp-', 'dsharp-web-'
          $out = "artifacts/release-stage/$webArchive"
          New-Item -ItemType Directory -Force "$webPub/plugins" | Out-Null
          tar -a -c -f $out --exclude=*.pdb --exclude=*.dbg -C $webPub .
          if ($LASTEXITCODE -ne 0) { throw 'WebHost archive creation failed' }
          $entries = tar -tf $out
          if (-not ($entries -match '^\./dsharp-web(\.exe)?$')) { throw 'WebHost executable is missing from its archive' }
          $verify = Join-Path $env:RUNNER_TEMP "verify-web-$env:FLAVOR-$env:RID"
          New-Item -ItemType Directory -Force $verify | Out-Null
          try {
            tar -xf $out -C $verify
            if ($LASTEXITCODE -ne 0) { throw 'WebHost archive extraction failed' }
            ./scripts/smoke-web-host.ps1 -WebPublishDir $verify `
              -TuiPublishDir "DeepSeek-Harness-Sharp/bin/Release/net10.0/$env:RID/publish" `
              -GuiPublishDir "DshGuiHost/bin/Release/net10.0/$env:RID/publish"
          } finally { Remove-Item $verify -Recurse -Force }

      - uses: actions/upload-artifact@v4
        with:
          name: web-${{ matrix.flavor }}-${{ matrix.rid }}
          path: artifacts/release-stage/dsharp-web-*
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: artifacts/release-stage/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: 创建/更新 Release
    needs: [prepare, test, build]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 创建或更新 Release（说明用 GitHub 自动生成）
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          FILES=(dist/*/*)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::没有可上传的产物"
            exit 1
          fi
          printf '待上传：\n'
          printf '  %s\n' "${FILES[@]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在：刷新资产（说明保持原样）"
            gh release upload "$TAG" "${FILES[@]}" --clobber
            gh release edit "$TAG" --latest
          else
            echo "创建 Release $TAG（说明自动生成）"
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG" --latest "${FILES[@]}"
          fi
          gh release view "$TAG" --json tagName,isPrerelease,assets \
            --jq '{tag: .tagName, prerelease: .isPrerelease, assets: [.assets[] | "\(.name) \(.size)"]}'
