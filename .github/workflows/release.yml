name: 发布 Release（JIT + AOT）

# 只在明确的发布点触发，日常提交不会发 Release：
#   1) push 形如 v0.1.1 的版本 tag；
#   2) 手动 workflow_dispatch（要求 tag 已先推送到仓库，也可只干跑不发布）。
# 每次发布同时产出 JIT 与 AOT 两档(与 ci.yml 不同: ci.yml 只在合入/手动时校验 AOT)。
# JIT 资产保持 dsharp-<rid> 的旧名(远端自动部署按此名下载), AOT 资产带 -aot 后缀。
# 发布说明由 GitHub 自动生成（--generate-notes），不在仓库里维护手写前端。
# 测试只在 ci.yml 中运行；本工作流读取该 commit 的 CI 结果，只构建和发布测试通过的平台。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的 tag（如 v0.1.1）；请先把 tag 推到仓库'
        required: true
      os:
        description: '发布平台；all 表示每个 CI 测试通过的平台都独立构建发布'
        type: choice
        options: [all, windows, linux, macos]
        default: all
      dry_run:
        description: '只构建与打包，不创建/更新 Release'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 判定发布点
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.detect.outputs.tag }}
      sha: ${{ steps.detect.outputs.sha }}
      requested: ${{ steps.detect.outputs.requested }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        name: 解析 tag
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          IN_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          IN_OS: ${{ inputs.os }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            TAG="$IN_TAG"
            REQUESTED="${IN_OS:-all}"
          else
            TAG="$REF_NAME"
            REQUESTED="all"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::没有解析到 tag"
            exit 1
          fi
          case "$REQUESTED" in
            all|windows|linux|macos) ;;
            *)
              echo "::error::未知发布平台: $REQUESTED"
              exit 1
              ;;
          esac
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          SHA=$(git rev-parse "$TAG^{commit}")
          {
            echo "tag=$TAG"
            echo "sha=$SHA"
            echo "requested=$REQUESTED"
          } >> "$GITHUB_OUTPUT"
          echo "tag=$TAG sha=$SHA requested=$REQUESTED"

  gate:
    name: 读取 CI 测试结果
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.gate.outputs.windows }}
      linux: ${{ steps.gate.outputs.linux }}
      macos: ${{ steps.gate.outputs.macos }}
      matrix: ${{ steps.gate.outputs.matrix }}
    steps:
      - id: gate
        name: 按平台读取 ci.yml 结果
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ needs.prepare.outputs.sha }}
          REQUESTED: ${{ needs.prepare.outputs.requested }}
        run: |
          set -euo pipefail
          RUN_ID=$(gh api "repos/$REPOSITORY/actions/runs?head_sha=$SHA&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "构建校验" and .status == "completed")][0].id // empty')
          if [ -z "$RUN_ID" ]; then
            echo "::error::找不到 $SHA 已完成的 ci.yml 运行；先让 CI 跑完再发布"
            exit 1
          fi
          echo "using ci run $RUN_ID"

          check_os() {
            local prefix="测试（$1"
            gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" \
              | jq -r --arg prefix "$prefix" '
                [.jobs[] | select(.name | startswith($prefix))] as $jobs
                | if ($jobs | length) == 0 then "missing"
                  elif any($jobs[]; .conclusion != "success" and .conclusion != "skipped") then "failed"
                  elif any($jobs[]; .conclusion == "success") then "passed"
                  else "skipped" end'
          }

          enabled() { [ "$REQUESTED" = "all" ] || [ "$REQUESTED" = "$1" ]; }
          declare -A STATES
          for platform in windows linux macos; do
            if ! enabled "$platform"; then
              STATES[$platform]=false
              continue
            fi
            case "$platform" in
              windows) runner=windows-latest ;;
              linux) runner=ubuntu-latest ;;
              macos) runner=macos-latest ;;
            esac
            state=$(check_os "$runner")
            echo "$platform=$state"
            if [ "$state" = "passed" ]; then
              STATES[$platform]=true
            else
              STATES[$platform]=false
              echo "::warning::$platform CI 测试未通过（$state），跳过该平台构建"
            fi
          done

          {
            echo "windows=${STATES[windows]}"
            echo "linux=${STATES[linux]}"
            echo "macos=${STATES[macos]}"
          } >> "$GITHUB_OUTPUT"
          if [ "${STATES[windows]}" = false ] && [ "${STATES[linux]}" = false ] && [ "${STATES[macos]}" = false ]; then
            echo "::error::没有请求的平台通过 CI 测试"
            exit 1
          fi

          matrix='[]'
          add_build() {
            matrix=$(jq -c --arg os "$1" --arg rid "$2" --arg flavor "$3" --arg archive "$4" --arg native "$5" \
              '. + [{os:$os, rid:$rid, flavor:$flavor, archive:$archive, "native-cc":$native}]' <<<"$matrix")
          }
          [ "${STATES[windows]}" = true ] && { add_build windows-latest win-x64 jit dsharp-win-x64.zip cl; add_build windows-latest win-x64 aot dsharp-win-x64-aot.zip cl; }
          [ "${STATES[linux]}" = true ] && { add_build ubuntu-latest linux-x64 jit dsharp-linux-x64.tar.gz clang; add_build ubuntu-latest linux-x64 aot dsharp-linux-x64-aot.tar.gz clang; }
          [ "${STATES[macos]}" = true ] && add_build macos-latest osx-arm64 jit dsharp-osx-arm64.tar.gz clang
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: 构建 ${{ matrix.flavor }} / ${{ matrix.rid }}
    needs: [prepare, gate]
    if: ${{ needs.gate.outputs.matrix != '[]' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.gate.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: 准备本地 NuGet feed（packages/，DryIoc.dll）
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -NoProfile -File scripts/fetch-dryioc-feed.ps1 -UseGhArtifact
          else
            bash scripts/fetch-dryioc-feed.sh --use-gh-artifact
          fi

      - name: 安装 Clang/LLVM 工具链（Linux；原生库与 AOT 链接共用）
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld zlib1g-dev

      - name: 发布产物（Release，自包含 + 裁剪）
        shell: bash
        env:
          FLAVOR: ${{ matrix.flavor }}
          RID: ${{ matrix.rid }}
          TAG: ${{ needs.prepare.outputs.tag }}
          NATIVE_CC: ${{ matrix.native-cc }}
        run: |
          set -euo pipefail
          # 程序集版本随 tag: 远端部署判据比较的就是它, 必须与发布的 tag 一致。
          VERSION="${TAG#v}"
          PUBLISH_ARGS=(-p:DshNativeCompiler="$NATIVE_CC")
          if [ "$FLAVOR" = "aot" ]; then
            # AOT 产物附带 fault probe, 供在目标机上回归 guard 的遏制。
            PUBLISH_ARGS+=(-p:PublishAot=true -p:DshShipFaultProbe=true)
          fi
          # 不指定 PublishDir，使用默认发布目录，避免 bash/Windows 路径转换问题。
          # DebugType=none：发布档不需要调试符号（AOT 的 pdb 单独就有数百 MB）。
          dotnet publish DeepSeek-Harness-Sharp/DeepSeek-Harness-Sharp.csproj \
            -c Release -r "$RID" "${PUBLISH_ARGS[@]}" \
            -p:Version="$VERSION" -p:DebugSymbols=false -p:DebugType=none \
            --nologo -v m
          # GUI 启动器一并发布并叠加进主产物。
          dotnet publish Dsh.GuiHost/Dsh.GuiHost.csproj -c Release -r "$RID" "${PUBLISH_ARGS[@]}" \
            -p:Version="$VERSION" -p:DebugSymbols=false -p:DebugType=none --nologo -v m
          # The Web entry keeps its runtime closure in a separate optional asset.
          dotnet publish Dsh.WebHost/Dsh.WebHost.csproj -c Release -r "$RID" "${PUBLISH_ARGS[@]}" \
            -p:Version="$VERSION" -p:DebugSymbols=false -p:DebugType=none --nologo -v m
          WEB_PUB="Dsh.WebHost/bin/Release/net10.0/$RID/publish"
          if [ "$FLAVOR" = "aot" ]; then
            bash scripts/assert-aot-output.sh "$WEB_PUB" dsharp-web
          fi
          pwsh -NoProfile -File scripts/smoke-web-host.ps1 \
            -WebPublishDir "$WEB_PUB" \
            -TuiPublishDir "DeepSeek-Harness-Sharp/bin/Release/net10.0/$RID/publish" \
            -GuiPublishDir "Dsh.GuiHost/bin/Release/net10.0/$RID/publish"
          PUB="DeepSeek-Harness-Sharp/bin/Release/net10.0/$RID/publish"
          GUI_PUB="Dsh.GuiHost/bin/Release/net10.0/$RID/publish"
          test -d "$PUB"
          test -d "$GUI_PUB"
          cp -R "$GUI_PUB"/. "$PUB"/
          rm -f "$PUB"/dsh-gui*.pdb "$PUB"/dsh-gui*.dbg
          STAGE="artifacts/release-stage/$FLAVOR-$RID"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/plugins"
          cp -R "$PUB/." "$STAGE/"
          for DISTRIBUTION in "$STAGE" "$WEB_PUB"; do
            if find "$DISTRIBUTION" -type f \( -name iroh-ssh -o -name iroh-ssh.exe \) -print -quit | grep -q .; then
              echo "::error::Release products must not bundle the optional native Iroh command"
              exit 1
            fi
          done
          NATIVES=(dsh_plugin_guard)
          if [ "$FLAVOR" = "aot" ]; then
            # 结构特征判别是否真的 AOT：JIT 发布同样会产出 apphost，光看文件存在拦不住。
            bash scripts/assert-aot-output.sh "$STAGE"
            NATIVES+=(dsh_fault_probe)
          fi
          for NATIVE in "${NATIVES[@]}"; do
            printf '%s\n' "$STAGE"/* | grep -E "/(lib)?$NATIVE\.(dll|so|dylib)$" || { echo "::error::产物缺少 $NATIVE"; exit 1; }
          done
          # 调试旁文件不进产物（AOT 的 .pdb/.dbg 动辄数百 MB）。
          rm -f "$STAGE"/*.pdb "$STAGE"/*.dbg
          echo "staging 文件数: $(find "$STAGE" -type f | wc -l)"
          echo "staging 体积: $(du -sh "$STAGE" | cut -f1)"

      - name: 打包并校验（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          FLAVOR: ${{ matrix.flavor }}
          RID: ${{ matrix.rid }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = "artifacts/release-stage/$env:FLAVOR-$env:RID"
          New-Item -ItemType Directory -Force "$stage/plugins" | Out-Null
          $out = "artifacts/release-stage/$env:ARCHIVE"
          Remove-Item -Force $out -ErrorAction SilentlyContinue
          # Windows 自带的 tar 是 bsdtar：-a 按扩展名生成 zip，且会保留空目录条目（plugins/）。
          tar.exe -a -c -f $out --exclude=*.pdb --exclude=*.dbg -C $stage .
          if ($LASTEXITCODE -ne 0) { throw "打包失败" }
          $entries = tar.exe -tf $out
          $junk = @($entries | Where-Object { $_ -match '\.(pdb|dbg)$' })
          if ($junk.Count -ne 0) { throw "归档里不该有调试符号：$($junk -join ', ')" }
          if (-not ($entries -match '^\./plugins/$')) { throw "归档缺少 plugins/ 目录条目" }
          $verify = Join-Path $env:RUNNER_TEMP "verify-$env:FLAVOR-$env:RID"
          Remove-Item -Recurse -Force $verify -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $out -DestinationPath $verify -Force
          if (-not (Test-Path "$verify/dsharp.exe")) { throw "归档里找不到 dsharp.exe" }
          if (-not (Test-Path "$verify/dsh-gui.exe")) { throw "归档里找不到 dsh-gui.exe" }
          if (-not (Test-Path "$verify/plugins")) { throw "归档里找不到 plugins/" }
          $env:DSH_HOME = Join-Path $env:RUNNER_TEMP "dsh-home-$env:FLAVOR-$env:RID"
          $proc = Start-Process -FilePath "$verify/dsharp.exe" -ArgumentList @('--help') -NoNewWindow -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/smoke.out" -RedirectStandardError "$env:RUNNER_TEMP/smoke.err"
          if (-not $proc.WaitForExit(60000)) { $proc.Kill($true); throw "冒烟超时" }
          if ($proc.ExitCode -ne 0) { throw "冒烟失败，exit=$($proc.ExitCode)" }
          Write-Host "归档校验通过：$env:ARCHIVE"

      - name: 打包并校验（POSIX）
        if: runner.os != 'Windows'
        shell: bash
        env:
          FLAVOR: ${{ matrix.flavor }}
          RID: ${{ matrix.rid }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          STAGE="artifacts/release-stage/$FLAVOR-$RID"
          mkdir -p "$STAGE/plugins"
          OUT="artifacts/release-stage/$ARCHIVE"
          rm -f "$OUT"
          tar -czf "$OUT" --exclude='*.pdb' --exclude='*.dbg' -C "$STAGE" .
          # 先把清单读进变量再用 grep: grep -q 命中即退出会让 tar 吃到 SIGPIPE, 在 set -o pipefail 下被误判为失败。
          ENTRIES="$(tar -tzf "$OUT")"
          if grep -qE '\.(pdb|dbg)$' <<<"$ENTRIES"; then
            echo "::error::归档里不该有调试符号"
            exit 1
          fi
          grep -qx './plugins/' <<<"$ENTRIES" || { echo "::error::归档缺少 plugins/ 目录条目"; exit 1; }
          VERIFY="$(mktemp -d)"
          tar -xzf "$OUT" -C "$VERIFY"
          test -f "$VERIFY/dsharp" || { echo "::error::归档里找不到 dsharp"; exit 1; }
          test -f "$VERIFY/dsh-gui" || { echo "::error::归档里找不到 dsh-gui"; exit 1; }
          test -d "$VERIFY/plugins" || { echo "::error::归档里找不到 plugins/"; exit 1; }
          chmod +x "$VERIFY/dsharp"
          cd "$VERIFY"
          # macOS 自带 bash 3.2 且没有 GNU timeout(只有 gtimeout 或都没有): 有就加超时, 没有就直接跑。
          TIMEOUT_CMD=""
          if command -v timeout >/dev/null 2>&1; then TIMEOUT_CMD="timeout 60"
          elif command -v gtimeout >/dev/null 2>&1; then TIMEOUT_CMD="gtimeout 60"
          fi
          # shellcheck disable=SC2086  # 这里就是要让 TIMEOUT_CMD 按词展开(空串即不加超时)
          DSH_HOME="$VERIFY/dsh-home" $TIMEOUT_CMD ./dsharp --help > "$VERIFY/smoke.out" 2>&1 || {
            echo "::error::冒烟失败"; tail -20 "$VERIFY/smoke.out"; exit 1; }
          cd - >/dev/null
          rm -rf "$VERIFY"
          echo "归档校验通过：$ARCHIVE"

      - name: 单独打包和冒烟 WebHost
        shell: pwsh
        env:
          FLAVOR: ${{ matrix.flavor }}
          RID: ${{ matrix.rid }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          $ErrorActionPreference = 'Stop'
          $webPub = "Dsh.WebHost/bin/Release/net10.0/$env:RID/publish"
          $webArchive = $env:ARCHIVE -replace '^dsharp-', 'dsharp-web-'
          $out = "artifacts/release-stage/$webArchive"
          New-Item -ItemType Directory -Force "$webPub/plugins" | Out-Null
          tar -a -c -f $out --exclude=*.pdb --exclude=*.dbg -C $webPub .
          if ($LASTEXITCODE -ne 0) { throw 'WebHost archive creation failed' }
          $entries = tar -tf $out
          if (-not ($entries -match '^\./dsharp-web(\.exe)?$')) { throw 'WebHost executable is missing from its archive' }
          $verify = Join-Path $env:RUNNER_TEMP "verify-web-$env:FLAVOR-$env:RID"
          New-Item -ItemType Directory -Force $verify | Out-Null
          try {
            tar -xf $out -C $verify
            if ($LASTEXITCODE -ne 0) { throw 'WebHost archive extraction failed' }
            ./scripts/smoke-web-host.ps1 -WebPublishDir $verify `
              -TuiPublishDir "DeepSeek-Harness-Sharp/bin/Release/net10.0/$env:RID/publish" `
              -GuiPublishDir "Dsh.GuiHost/bin/Release/net10.0/$env:RID/publish"
          } finally { Remove-Item $verify -Recurse -Force }

      - uses: actions/upload-artifact@v4
        with:
          name: web-${{ matrix.flavor }}-${{ matrix.rid }}
          path: artifacts/release-stage/dsharp-web-*
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: artifacts/release-stage/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: 创建/更新 Release
    needs: [prepare, gate, build]
    if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && needs.gate.outputs.matrix != '[]' && needs.build.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 创建或更新 Release（说明用 GitHub 自动生成）
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          FILES=(dist/*/*)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::没有可上传的产物"
            exit 1
          fi
          printf '待上传：\n'
          printf '  %s\n' "${FILES[@]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在：刷新资产（说明保持原样）"
            gh release upload "$TAG" "${FILES[@]}" --clobber
            gh release edit "$TAG" --latest
          else
            echo "创建 Release $TAG（说明自动生成）"
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG" --latest "${FILES[@]}"
          fi
          gh release view "$TAG" --json tagName,isPrerelease,assets \
            --jq '{tag: .tagName, prerelease: .isPrerelease, assets: [.assets[] | "\(.name) \(.size)"]}'
