name: Product NativeAOT publish validation

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      rid:
        required: true
        type: string
      native-cc:
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish and validate product entries (${{ inputs.rid }})
    runs-on: ${{ inputs.os }}
    # Windows runs three full ILC passes before regression checks and artifact upload.
    timeout-minutes: ${{ startsWith(inputs.rid, 'win-') && 60 || 40 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' && format('refs/pull/{0}/merge', github.event.number) || github.sha }}
          fetch-depth: 0

      - name: Check PR merge checkout contains the current head
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PR_HEAD_SHA" HEAD

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Prepare local NuGet feed
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -NoProfile -File scripts/fetch-dryioc-feed.ps1 -UseGhArtifact
          else
            bash scripts/fetch-dryioc-feed.sh --use-gh-artifact
          fi

      - name: Install AOT toolchain on Linux
        if: inputs.rid == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld zlib1g-dev

      - name: Publish native plugin sample before product builds
        if: inputs.rid == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          # Keep the generator's cold restore covered before product builds warm it.
          dotnet publish tests/Dsh.NativePluginSample -c Release --nologo -v m

      - name: Publish the product's three NativeAOT entries
        shell: bash
        run: |
          set -euo pipefail
          RID='${{ inputs.rid }}'
          PUBLISH_ARGS=(
            -c Release -r "$RID" -p:PublishAot=true --self-contained true
            -p:DebugSymbols=false -p:DebugType=none
            -p:DshNativeCompiler='${{ inputs.native-cc }}' -p:DshShipFaultProbe=true
            --nologo -v m
          )
          dotnet publish DeepSeek-Harness-Sharp/DeepSeek-Harness-Sharp.csproj "${PUBLISH_ARGS[@]}"
          dotnet publish DshGuiHost/DshGuiHost.csproj "${PUBLISH_ARGS[@]}"
          dotnet publish Dsh.WebHost/Dsh.WebHost.csproj "${PUBLISH_ARGS[@]}"

      - name: Assert NativeAOT output and smoke test the product's three entries
        shell: bash
        run: |
          set -euo pipefail
          RID='${{ inputs.rid }}'
          PUB="DeepSeek-Harness-Sharp/bin/Release/net10.0/$RID/publish"
          GUI_PUB="DshGuiHost/bin/Release/net10.0/$RID/publish"
          WEB_PUB="Dsh.WebHost/bin/Release/net10.0/$RID/publish"
          for OUTPUT in "$PUB" "$GUI_PUB" "$WEB_PUB"; do
            if find "$OUTPUT" -type f \( -name iroh-ssh -o -name iroh-ssh.exe \) -print -quit | grep -q .; then
              echo "::error::NativeAOT products must not bundle the optional native Iroh command"
              exit 1
            fi
          done
          bash scripts/assert-aot-output.sh "$PUB"
          bash scripts/assert-aot-output.sh "$GUI_PUB" dsh-gui
          bash scripts/assert-aot-output.sh "$WEB_PUB" dsharp-web
          for ROOT in "$PUB" "$GUI_PUB" "$WEB_PUB"; do
            for NATIVE in dsh_plugin_guard dsh_fault_probe; do
              printf '%s\n' "$ROOT"/* | grep -E "/(lib)?$NATIVE\.(dll|so|dylib)$" || { echo "::error::AOT output is missing $NATIVE in $ROOT"; exit 1; }
            done
          done
          pwsh -NoProfile -File scripts/smoke-web-host.ps1 \
            -WebPublishDir "$WEB_PUB" \
            -TuiPublishDir "$PUB" \
            -GuiPublishDir "$GUI_PUB"
          mkdir -p "$PUB/plugins"
          EXE="$PUB/dsharp"
          if [ ! -f "$EXE" ]; then
            EXE="$EXE.exe"
          fi
          if command -v timeout >/dev/null 2>&1; then
            timeout 120 "$EXE" --help > "$RUNNER_TEMP/aot-smoke.out" 2>&1
          else
            "$EXE" --help > "$RUNNER_TEMP/aot-smoke.out" 2>&1
          fi || {
            echo "::error::AOT smoke test failed"
            tail -20 "$RUNNER_TEMP/aot-smoke.out"
            exit 1
          }
          echo "AOT smoke test passed"

      - name: Regress published guard and probe, including Linux AOT plugin ABI
        shell: bash
        run: |
          set -euo pipefail
          RID='${{ inputs.rid }}'
          PUB="DeepSeek-Harness-Sharp/bin/Release/net10.0/$RID/publish"
          BIN="tests/Dsh.Tests/bin/Debug/net10.0"
          CLASSES=(-class Dsh.Tests.NativeGuardTests)
          dotnet build tests/Dsh.Tests/Dsh.Tests.csproj -c Debug --nologo -v m -p:DshNativeCompiler='${{ inputs.native-cc }}'
          if [ "$RID" = "linux-x64" ]; then
            CLASSES+=(-class Dsh.Tests.NativePluginAbiTests)
          fi
          # Run the real JIT test host with the guard and probe from the published release.
          for NATIVE in dsh_plugin_guard dsh_fault_probe; do
            FILE="$(printf '%s\n' "$PUB"/* | grep -E "/(lib)?$NATIVE\.(dll|so|dylib)$")"
            FILE="${FILE##*/}"
            cp "$PUB/$FILE" "$BIN/$FILE"
            cmp "$PUB/$FILE" "$BIN/$FILE"
            echo "Regression uses AOT output: $PUB/$FILE"
          done
          EXE="$BIN/Dsh.Tests"
          if [ ! -x "$EXE" ]; then
            EXE="$EXE.exe"
          fi
          "$EXE" -noColor "${CLASSES[@]}" -failSkips

      - name: Archive the product's three complete publish roots
        shell: bash
        run: |
          set -euo pipefail
          RID='${{ inputs.rid }}'
          PUB="DeepSeek-Harness-Sharp/bin/Release/net10.0/$RID/publish"
          GUI_PUB="DshGuiHost/bin/Release/net10.0/$RID/publish"
          WEB_PUB="Dsh.WebHost/bin/Release/net10.0/$RID/publish"
          for ROOT in "$PUB" "$GUI_PUB" "$WEB_PUB"; do
            test -d "$ROOT"
            rm -f "$ROOT"/*.pdb "$ROOT"/*.dbg
          done
          mkdir -p artifacts
          TAR="tar"
          if [ "$RUNNER_OS" = "Windows" ]; then
            TAR="$(cygpath -u "$WINDIR")/System32/tar.exe"
          fi
          # Archive each complete entry root before artifact upload changes Unix modes.
          "$TAR" -cf "artifacts/aot-$RID-cli.tar" -C "$PUB" .
          "$TAR" -cf "artifacts/aot-$RID-gui.tar" -C "$GUI_PUB" .
          "$TAR" -cf "artifacts/aot-$RID-web.tar" -C "$WEB_PUB" .

      - uses: actions/upload-artifact@v4
        with:
          name: aot-${{ inputs.rid }}
          path: artifacts/aot-${{ inputs.rid }}-*.tar
          if-no-files-found: error
          retention-days: 7
